# Ruff config for scripts/ and tests/.
#
# WHY THIS FILE EXISTS: the CI job (.github/workflows/tests.yml) ran
# `ruff check` with no configuration, which means it inherited whatever the
# latest ruff release considered default. Those defaults widened over time, so
# the job went red — 166 findings — without a single line of this repo
# changing, and stayed red long enough to become background noise. A lint that
# always fails is exactly as useless as one that cannot fail.
#
# So the rule set is pinned HERE and the ruff version is pinned in the
# workflow. Both have to move deliberately.
#
# `select` is ruff's own documented default (E4/E7/E9 + pyflakes) plus import
# sorting. That is: real defects — undefined names, unused imports, broken
# syntax, shadowed builtins — plus one mechanical hygiene rule that fixes
# itself. Nothing here is a matter of taste.
[lint]
select = [
    "E4",  # imports: unsorted-within-line, multiple-on-one-line, not-at-top
    "E7",  # statement smells: ambiguous names, comparison to None/True
    "E9",  # syntax/IO errors ruff could not parse past
    "F",   # pyflakes: undefined names, unused imports, f-string bugs
    "I",   # import sorting (auto-fixable)
]

# DELIBERATELY NOT SELECTED. Each was evaluated against the actual tree when
# this file was written; the count is what it would have flagged. They are
# refactor opinions, not defects, and adopting one means a large mechanical
# diff through code that is working. Revisit individually, never as a batch:
#
#   FURB (49)  mostly `re.M` -> `re.MULTILINE`. The short aliases are used
#              consistently across every generator and test; churn, not clarity.
#   UP   (13)  `%`-formatting -> f-strings. Same story.
#   B    (26)  bugbear. The most tempting of these — B905 (`zip()` without
#              `strict=`) and B020 (loop variable shadowing its iterable, one
#              real-looking hit in simulate_balance.py:735) are worth a look
#              on their own merits. Adopt after reviewing those, not before.
#   PLW/PLR/C/SIM/RUF/PERF/BLE/S — style and micro-optimisation.
#
# E501 (line length) is not in E4/E7/E9 and is not wanted: this codebase uses
# long single-line data tables and long explanatory comments on purpose.

[lint.per-file-ignores]
# build_save.py imports path_layouts next to the board-snap table that uses it,
# with a comment explaining that the tile positions and the printed rings come
# from the same source. Moving it to the top would separate the two.
"scripts/build_save.py" = ["E402"]
